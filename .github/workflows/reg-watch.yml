name: reg-watcher weekly check

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 00:00 UTC
  workflow_dispatch: {} # 수동 실행도 허용

permissions:
  contents: write
  pull-requests: write

jobs:
  reg-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run reg-watcher
        run: pnpm agent:reg-watch

      # reg-watcher only ever writes to packages/ruleset/proposals/ and logs/ —
      # never to factors/, regulations/, or changelog.md (root CLAUDE.md 승인 게이트 ①).
      # This step opens a PR with those files for a human to review; it never merges.
      - name: Open PR with any new proposals/logs
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "reg-watcher: weekly source check"
          branch: reg-watcher/weekly-check
          title: "reg-watcher: 주간 규제/계수 소스 점검 결과"
          body: |
            reg-watcher가 `agents/reg-watcher/sources.yaml`의 검증된(verified: true) 소스를
            조회한 결과입니다. `packages/ruleset/proposals/`에 새 제안 파일이 있다면
            `sop/ruleset-approval.md` 절차에 따라 검토해 주세요.

            이 PR은 자동 병합되지 않습니다.
          add-paths: |
            packages/ruleset/proposals/**
            logs/**
