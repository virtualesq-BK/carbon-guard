scope2_reporting: # 2026-02 국내 "글로벌 공시기준 Scope1,2 조직경계·배출량 산정 사례집" 기준 확인된 요건
  requirement: >
    ESRS(CSRD)는 IFRS S2와 달리 Scope 2를 지역기반(location-based) 총배출량과
    시장기반(market-based) 총배출량 "둘 다" 공시해야 한다 — 지역기반만 필수인
    IFRS S2보다 요구 수준이 높음. 시장기반 배출량은 구매 전력의 실제 계약(PPA 등)
    기반 배출계수를 사용하여 산정한다.
  source: "기후에너지환경부·한국환경산업기술원, 「글로벌 공시기준에 따른 온실가스 Scope 1,2 배출량 보고를 위한 조직경계 설정·배출량 산정 사례집」, 2026-02 발간, PART II 2)"
